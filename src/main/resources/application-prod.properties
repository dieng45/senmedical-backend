# application-prod.properties
# Configuration utilisee uniquement en production (Render + Supabase)
# Les valeurs sensibles viennent de variables d'environnement, jamais ecrites ici en clair
spring.application.name=senmedical

# Connexion a la base Supabase (Session pooler, compatible IPv4)
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.rtltipjkgdgcgwmrpczd
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate : cree/met a jour automatiquement les tables a partir des entites Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render fournit automatiquement le port via la variable PORT
server.port=${PORT:8080}

# Cle secrete JWT, fournie via variable d'environnement
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Cle API Gemini, fournie via variable d'environnement
gemini.api.key=${GEMINI_API_KEY}

# Taille maximale des fichiers uploades
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB